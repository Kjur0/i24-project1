name: Prośba o poprawę dostępności
description: Zaproponuj usprawnienie dostępności istniejącej funkcji.
title: "[Dostępność]: "
type: Feature
labels:
  - accessibility
body:
  - type: markdown
    attributes:
      value: |
        Ten formularz służy do propozycji usprawnień. Jeśli istniejące działanie
        jest niedostępne lub zepsute, użyj formularza zgłoszenia błędu. Nie
        podawaj danych osobowych ani informacji o stanie zdrowia.
  - type: textarea
    id: affected
    attributes:
      label: Która strona, funkcja lub czynność wymaga poprawy?
      description: Podaj miejsce i opisz, co próbujesz zrobić.
    validations:
      required: true
  - type: textarea
    id: barrier
    attributes:
      label: Jaki problem, ograniczenie lub potrzeba dostępnościowa występuje?
      description: Opisz sytuację bez ujawniania prywatnych informacji.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Oczekiwany rezultat
      description: Jak aplikacja powinna zachowywać się po wprowadzeniu poprawy?
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Kryteria sukcesu
      description: Wypisz rezultaty, po których będzie można sprawdzić, czy bariera została usunięta.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: false
  - type: textarea
    id: assistive_technology
    attributes:
      label: Metoda obsługi lub technologia asystująca (opcjonalnie)
      description: Na przykład klawiatura, powiększenie albo czytnik ekranu. Nie podawaj diagnozy ani informacji o stanie zdrowia.
    validations:
      required: false
