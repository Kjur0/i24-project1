name: Accessibility improvement
description: Suggest an accessibility improvement to an existing feature.
type: Feature
labels:
  - accessibility
body:
  - type: markdown
    attributes:
      value: |
        Use this form to suggest an improvement. If existing behavior is
        inaccessible or broken, use the bug report form. Do not share personal
        data, diagnoses, or health information.
  - type: textarea
    id: affected
    attributes:
      label: Which page, feature, or task needs improvement?
      description: Identify where the issue occurs and what you are trying to do.
    validations:
      required: true
  - type: textarea
    id: barrier
    attributes:
      label: What accessibility barrier or limitation are you encountering?
      description: Describe the situation without sharing private information.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: How should the application behave after the improvement?
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Success criteria
      description: List observable results that would show the barrier has been removed.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: false
  - type: textarea
    id: assistive_technology
    attributes:
      label: Input method or assistive technology (optional)
      description: For example, keyboard, magnification, or a screen reader. Do not share a diagnosis or health information.
    validations:
      required: false
