name: Zgłoszenie błędu
description: Zgłoś problem, który można odtworzyć w aplikacji lub repozytorium.
title: "[Błąd]: "
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Przed wysłaniem sprawdź istniejące zgłoszenia. Nie zamieszczaj haseł,
        kluczy prywatnych, kodów OTP ani danych osobowych.
  - type: input
    id: version
    attributes:
      label: Wersja lub commit
      description: Jeśli wiesz, podaj wersję, gałąź lub commit.
    validations:
      required: false
  - type: textarea
    id: problem
    attributes:
      label: Co się stało?
      description: Opisz problem i jego wpływ na korzystanie z aplikacji.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Kroki odtworzenia
      description: Podaj najmniejszy zestaw kroków pozwalający odtworzyć problem.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Oczekiwane zachowanie
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Środowisko
      description: Przeglądarka, system operacyjny i istotna konfiguracja bez sekretów.
    validations:
      required: false
  - type: textarea
    id: accessibility
    attributes:
      label: Kontekst dostępności (opcjonalnie)
      description: Jeśli problem dotyczy dostępności, opisz używaną metodę obsługi lub technologię asystującą. Nie podawaj informacji o stanie zdrowia.
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Dodatkowe informacje (opcjonalnie)
      description: Dodaj zrzut ekranu lub komunikat błędu po usunięciu danych poufnych.
    validations:
      required: false
