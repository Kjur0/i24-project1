name: Feature request
description: Suggest an improvement or new capability.
title: "[Feature]: "
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Describe the user need rather than prescribing an implementation.
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Explain the user need or limitation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the behavior you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add relevant context without including secrets or personal data.
    validations:
      required: false
