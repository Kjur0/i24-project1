name: Code and documentation quality

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect relevant file changes
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        name: Check changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "docs=true" >> "$GITHUB_OUTPUT"
          else
            if git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -Eq '(^|/)[^/]+\.(cjs|js|jsx|mjs|ts|tsx)$|^(eslint\.config\.mjs|next\.config\.ts|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|postcss\.config\.mjs|tsconfig\.json)$|^\.github/workflows/code-quality\.yml$'; then
              echo "code=true" >> "$GITHUB_OUTPUT"
            else
              echo "code=false" >> "$GITHUB_OUTPUT"
            fi
            if git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -Eq '(^|/)[^/]+\.md$|^(eslint\.config\.mjs|package\.json|pnpm-lock\.yaml)$|^\.github/workflows/code-quality\.yml$'; then
              echo "docs=true" >> "$GITHUB_OUTPUT"
            else
              echo "docs=false" >> "$GITHUB_OUTPUT"
            fi
          fi
  lint-code:
    name: Lint JavaScript and TypeScript
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm, Node.js, and dependencies
        uses: pnpm/setup@v3
      - name: Lint code
        run: pnpm lint:code
  typecheck:
    name: TypeScript typecheck
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm, Node.js, and dependencies
        uses: pnpm/setup@v3
      - name: TypeScript typecheck
        run: pnpm typecheck
  format:
    name: Prettier formatting check
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm, Node.js, and dependencies
        uses: pnpm/setup@v3
      - name: Check formatting
        run: pnpm format:check
  lint-docs:
    name: Lint Markdown documentation
    needs: changes
    if: needs.changes.outputs.docs == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm, Node.js, and dependencies
        uses: pnpm/setup@v3
      - name: Lint Markdown
        run: pnpm lint:docs
